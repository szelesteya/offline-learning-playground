[project]
name = "offline-learning-playground"
version = "0.1.0"
description = "A research playground for offline RL, with a focus on model-based methods."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "hydra-core>=1.3.4",
    "typer>=0.27.0",
]

[project.scripts]
olp = "olp.cli.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/olp"]
